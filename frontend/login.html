<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Digital Carbon Auditor</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <a href="index.html" class="auth-logo">
            🌱 Digital Carbon Auditor
        </a>

        <div class="auth-card">

            <div class="auth-header">
                <span class="section-label">WELCOME BACK</span>
                <h1>Welcome back</h1>
                <p>Continue your journey toward a cleaner digital world.</p>
            </div>

            <form id="login-form">

                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input
                        type="email"
                        id="login-email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div id="login-message" class="form-message"></div>

                <button type="submit" class="btn btn-primary auth-button">
                    Login
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
