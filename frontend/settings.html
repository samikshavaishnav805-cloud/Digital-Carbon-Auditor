<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | Digital Carbon Auditor</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="dashboard-page">

<div class="dashboard-layout">

    <aside class="sidebar">

        <a href="dashboard.html" class="sidebar-logo">
            🌱
            <span>Digital Carbon<br>Auditor</span>
        </a>

        <nav class="sidebar-nav">
            <a href="dashboard.html"><span>▦</span> Dashboard</a>
            <a href="calculator.html"><span>♧</span> Calculator</a>
            <a href="reports.html"><span>▤</span> Reports</a>
            <a href="history.html"><span>◷</span> History</a>
            <a href="settings.html" class="active"><span>⚙</span> Settings</a>
        </nav>

        <div class="sidebar-bottom">
            <button id="logout-btn" class="logout-btn">↪ Logout</button>
        </div>

    </aside>


    <main class="dashboard-main">

        <header class="dashboard-header">
            <div>
                <span class="section-label">SETTINGS</span>
                <h1>Profile & Settings</h1>
                <p>Manage your account information.</p>
            </div>
        </header>


        <section class="dashboard-panel settings-panel">

            <div class="panel-header">
                <div>
                    <h2>Profile Information</h2>
                    <p>Update your personal and organization details.</p>
                </div>
            </div>


            <form id="settings-form">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="settings-name">Full Name</label>
                        <input type="text" id="settings-name">
                    </div>

                    <div class="form-group">
                        <label for="settings-email">Email</label>
                        <input type="email" id="settings-email">
                    </div>

                    <div class="form-group">
                        <label for="settings-company">Company</label>
                        <input type="text" id="settings-company">
                    </div>

                </div>

                <div id="settings-message" class="form-message"></div>

                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

            </form>

        </section>


        <section class="dashboard-panel danger-panel">

            <div class="panel-header">
                <div>
                    <h2>Account</h2>
                    <p>Manage your current session.</p>
                </div>
            </div>

            <button id="settings-logout" class="btn btn-outline">
                Logout
            </button>

        </section>

    </main>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
